name: Release

# Push a version tag (git tag v0.1.0 && git push --tags) -> builds Sesli.exe on a clean Windows
# runner and publishes it as a GitHub Release. "Run workflow" builds without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install (only what Sesli needs, so the exe stays small)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Sesli.exe
        run: python tools/build_exe.py

      - name: Check size
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item dist/Sesli.exe).Length / 1MB, 1)
          "Sesli.exe: $mb MB"
          if ($mb -gt 150) { throw "exe is $mb MB; something unexpected got bundled" }

      - uses: actions/upload-artifact@v4
        with:
          name: Sesli-exe
          path: dist/Sesli.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Sesli.exe
          generate_release_notes: true
